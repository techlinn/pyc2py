[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyc2py"
version = "0.1.0"
description = "A Python bytecode decompiler that checks its own output against the original."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tech" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["decompiler", "bytecode", "pyc", "pypy", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Repository = "https://github.com/techlinn/pyc2py"
Issues = "https://github.com/techlinn/pyc2py/issues"

[project.scripts]
pyc2py = "pyc2py.cli:main"

[project.optional-dependencies]
# ruff 0.15-0.17 mis-formats `except (A, B):` into invalid `except A, B:`; pin < 0.15
dev = ["ruff>=0.14,<0.15", "pyright>=1.1.400"]

[tool.setuptools.packages.find]
include = ["pyc2py*"]

[tool.ruff]
line-length = 88
target-version = "py314"
# test inputs, and target.py which runs under Python 2.7 and 3.0
extend-exclude = [
    "tests/bench/corpus",
    "tests/bench/programs",
    "tests/bench/target.py",
    "tests/versions/sources",
]

[tool.ruff.lint]
select = ["B", "C4", "C901", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP", "W"]
# marks on AST nodes are not fields, so they are set and read by name
ignore = ["B009", "B010"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pyc2py.types.OutputOptions"]

[tool.ruff.lint.isort]
known-local-folder = ["support", "interpreters", "inputs", "report", "tools"]

[tool.ruff.lint.per-file-ignores]
# DecompilerContext is a protocol-style interface: its mutable defaults only
# declare member types and are always shadowed by NativeDecompiler's fields
"pyc2py/decompiler/context.py" = ["RUF012"]

[tool.pyright]
include = ["pyc2py", "tests"]
exclude = [
    "tests/bench/corpus",
    "tests/bench/programs",
    "tests/bench/target.py",
    "tests/versions/sources",
]
extraPaths = ["tests/bench"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
