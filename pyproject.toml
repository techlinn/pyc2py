[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyc2py"
version = "0.1.0"
description = "A Python .pyc decompiler with version-aware bytecode handling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["black>=24", "pyflakes>=3", "pytest>=8", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["pyc2py*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
# snippet fixtures intentionally contain "unclean" code to exercise recovery
extend-exclude = ["tests/snippets"]

[tool.ruff.lint]
# conservative ruleset: catch real errors without restyling the existing
# import layout and idioms the project already uses
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
