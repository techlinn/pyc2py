[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyc2py"
version = "0.1.0"
description = "A Python .pyc decompiler with version-aware bytecode handling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["black>=24", "pyflakes>=3", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["pyc2py*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["C4", "C901", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true
